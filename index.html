<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="./favicon-hy.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0e0e0e" />
  <meta name="description"
    content="Lễ thành hôn của Đình Tiến và Thu Hằng" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Đình Tiến &amp; Thu Hằng</title>
  <!-- GitHub Pages SPA: restore URL after 404.html redirect -->
  <script>
    (function () {
      var redirect = sessionStorage.getItem('spa_redirect');
      if (redirect) {
        sessionStorage.removeItem('spa_redirect');
        var base = '/wedding-invitation';
        window.history.replaceState(null, '', base + redirect);
      }
    }());
  </script>
  <!-- Preload Critical Hero Background (WebP for modern browsers, JPG fallback) -->
  <link rel="preload" as="image" href="./image/bg.webp" type="image/webp" imagesrcset="./image/bg.webp" />
  <link rel="preload" as="image" href="./image/bg.jpg" type="image/jpeg" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Inter:wght@300;400;500;600&family=Great+Vibes&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
