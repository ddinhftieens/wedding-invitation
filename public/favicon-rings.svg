<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Luxury Gold Gradient for Rings -->
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fbbf24" />
      <stop offset="65%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Rose Gold / Warm Gradient for 2nd Ring -->
    <linearGradient id="goldGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe4e6" />
      <stop offset="30%" stop-color="#fb7185" />
      <stop offset="70%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>

    <!-- Diamond Gradient -->
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#bae6fd" />
      <stop offset="80%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#ringGlow)">
    <!-- LEFT RING (Passes under right ring at bottom, over at top) -->
    <g transform="translate(36, 56) rotate(-12)">
      <!-- Outer & Inner Circles create ring tube -->
      <circle cx="0" cy="0" r="23" fill="none" stroke="url(#goldGrad1)" stroke-width="7.5" />
      <circle cx="0" cy="0" r="23" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.2" />
    </g>

    <!-- RIGHT RING (Rose Gold) -->
    <g transform="translate(64, 56) rotate(12)">
      <circle cx="0" cy="0" r="23" fill="none" stroke="url(#goldGrad2)" stroke-width="7.5" />
      <circle cx="0" cy="0" r="23" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.2" />
    </g>

    <!-- Interlocking Overlap Fix: Re-draw top-left arc of left ring over right ring -->
    <g transform="translate(36, 56) rotate(-12)">
      <path d="M 12 -20 A 23 23 0 0 1 23 0" fill="none" stroke="url(#goldGrad1)" stroke-width="7.5" />
      <path d="M 12 -20 A 23 23 0 0 1 23 0" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.2" />
    </g>

    <!-- Sparkling Diamond on Left/Top Ring -->
    <!-- Diamond Mount / Crown -->
    <path d="M 27 34 L 35 34 L 34 38 L 28 38 Z" fill="#d97706" />
    <!-- Diamond Gem -->
    <polygon points="31,16 38,25 35,34 27,34 24,25" fill="url(#diamondGrad)" stroke="#ffffff" stroke-width="0.8" stroke-linejoin="round" />
    <!-- Diamond Facets -->
    <polygon points="31,16 28,25 31,34 34,25" fill="#ffffff" opacity="0.75" />
    <line x1="24" y1="25" x2="38" y2="25" stroke="#ffffff" stroke-width="0.6" opacity="0.8" />

    <!-- Sparkle Star (Twinkle) -->
    <g transform="translate(42, 16) scale(0.9)">
      <path d="M 0,-8 Q 0,0 8,0 Q 0,0 0,8 Q 0,0 -8,0 Q 0,0 0,-8 Z" fill="#ffffff" />
      <circle cx="0" cy="0" r="1.5" fill="#38bdf8" />
    </g>
  </g>
</svg>
